databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow
    user: taskflow

services:
  - type: redis
    name: taskflow-redis
    plan: free
    ipAllowList: [] # keeps it internal only

  - type: web
    name: taskflow-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run db:generate && npm run build
    startCommand: npm run db:deploy && node dist/src/worker.js & npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
