openapi: 3.0.0
info:
  title: TaskFlow API
  description: API documentation for the TaskFlow backend
  version: 1.0.0
servers:
  - url: https://taskflow-api-sbc6.onrender.com
    description: Production Server (Render)
  - url: http://localhost:3000
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        code:
          type: string
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        dueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    JobStatus:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum: [completed, failed, delayed, active, waiting, unknown]
        progress:
          type: number
        failedReason:
          type: string
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, orgName]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                orgName:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Email already in use
  /auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
  /auth/refresh:
    post:
      summary: Refresh tokens
      tags:
        - Authentication
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens refreshed
        '401':
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      summary: Logout current session
      tags:
        - Authentication
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logged out successfully
  /auth/logout-all:
    post:
      summary: Logout all sessions
      tags:
        - Authentication
      responses:
        '200':
          description: All sessions revoked
  /auth/me:
    get:
      summary: Get current user profile
      tags:
        - Authentication
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
  /orgs:
    get:
      summary: List user organizations
      tags:
        - Organizations
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
  /orgs/{orgId}:
    get:
      summary: Get organization by ID
      tags:
        - Organizations
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
  /orgs/{orgId}/members:
    post:
      summary: Add a member to organization
      tags:
        - Organizations
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [org_admin, member]
      responses:
        '200':
          description: Member added
  /orgs/{orgId}/members/{userId}:
    delete:
      summary: Remove member from organization
      tags:
        - Organizations
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed
  /orgs/{orgId}/projects:
    post:
      summary: Create a project
      tags:
        - Projects
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
    get:
      summary: List projects
      tags:
        - Projects
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Paginated projects
  /orgs/{orgId}/projects/{projectId}:
    get:
      summary: Get a project
      tags:
        - Projects
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
    put:
      summary: Update a project
      tags:
        - Projects
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Project updated
    delete:
      summary: Soft delete a project
      tags:
        - Projects
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Project deleted
  /orgs/{orgId}/projects/{projectId}/tasks:
    post:
      summary: Create a task
      tags:
        - Tasks
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [todo, in_progress, review, done]
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                dueDate:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Task'
    get:
      summary: List tasks
      tags:
        - Tasks
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated tasks
  /orgs/{orgId}/projects/{projectId}/tasks/bulk-status:
    patch:
      summary: Bulk update task statuses
      tags:
        - Tasks
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskIds, status]
              properties:
                taskIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                status:
                  type: string
                  enum: [todo, in_progress, review, done]
      responses:
        '200':
          description: Tasks updated
  /orgs/{orgId}/projects/{projectId}/tasks/{taskId}:
    get:
      summary: Get task details
      tags:
        - Tasks
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
    put:
      summary: Update a task
      tags:
        - Tasks
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [todo, in_progress, review, done]
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                dueDate:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Task updated
    delete:
      summary: Delete a task
      tags:
        - Tasks
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task deleted
  /orgs/{orgId}/projects/{projectId}/tasks/{taskId}/assign:
    post:
      summary: Assign user to task
      tags:
        - Tasks
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: User assigned
  /orgs/{orgId}/projects/{projectId}/tasks/{taskId}/assign/{userId}:
    delete:
      summary: Unassign user from task
      tags:
        - Tasks
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User unassigned
  /jobs/{id}:
    get:
      summary: Get queue job status
      tags:
        - Background Jobs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobStatus'
