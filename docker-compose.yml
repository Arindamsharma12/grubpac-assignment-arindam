services:
  api:
    build: .
    container_name: taskflow-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://taskflow:taskflow_password@postgres:5432/taskflow?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=3000
      - JWT_ACCESS_SECRET=taskflow-access-secret-123
      - JWT_REFRESH_SECRET=taskflow-refresh-secret-123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npm run db:deploy && npm start"

  worker:
    build: .
    container_name: taskflow-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://taskflow:taskflow_password@postgres:5432/taskflow?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=taskflow-access-secret-123
      - JWT_REFRESH_SECRET=taskflow-refresh-secret-123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:worker

  postgres:
    image: postgres:17-alpine
    container_name: taskflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_password
      POSTGRES_DB: taskflow

    ports:
      - "5433:5432"

    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - taskflow_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taskflow_postgres_data:
  taskflow_redis_data:
